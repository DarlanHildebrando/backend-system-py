services:
  db:
    image: postgres:15
    container_name: dbi
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inkluaticket
    ports:
      - "5432:5432"
    mem_limit: 500m
    mem_reservation: 100m
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backendp:
    build: .
    container_name: backendp
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inkluaticket
    mem_limit: 1g
    mem_reservation: 200m
    depends_on:
      - db    

volumes:
  postgres_data: